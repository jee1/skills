name: CI

on:
  push:
    branches: [main, 'tech-debt/**', 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill validator unit tests
        run: ./scripts/run-tests.sh
